# ============================================================
# IEVF Agreement-Bias Study - master configuration
#
# To swap or add an LLM you ONLY edit this file + .env:
#   1. add a block under `models:` (or `judges:`)
#   2. put its token in .env under the name given in `api_key_env`
# No Python file ever needs to change.
#
# provider = the API style, not the company:
#   openai      -> any OpenAI-compatible endpoint (set base_url for DeepSeek,
#                  Qwen, Moonshot, OpenRouter, local vLLM, ...)
#   anthropic   -> Anthropic messages API
#   google      -> Google GenAI API
#   huggingface -> LOCAL inference via transformers: no api_key_env needed,
#                  weights download once from the Hub, then run offline.
# family   = used to keep the judge independent: a model is never graded
#            by a judge of its own family.
# ============================================================

paths:
  items: data/processed/items.jsonl      # normalized question bank
  db: logs/results.db                    # every model response + grading
  reports: reports                       # metrics tables + figures

models:
  gpt-5:
    provider: openai
    model: gpt-5
    api_key_env: OPENAI_API_KEY
    family: openai
  claude-sonnet:
    provider: anthropic
    model: claude-sonnet-4-5-20250929
    api_key_env: ANTHROPIC_API_KEY
    family: anthropic
  gemini:
    provider: google
    model: gemini-flash-latest
    api_key_env: GOOGLE_API_KEY
    family: google
  deepseek:
    provider: openai
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    family: deepseek
  qwen:
    provider: openai
    model: qwen-plus
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    family: alibaba
  kimi:
    provider: openai
    model: moonshot-v1-8k
    api_key_env: MOONSHOT_API_KEY
    base_url: https://api.moonshot.ai/v1
    family: moonshot
  groq:
    provider: openai
    model: llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    family: groq
  # Local Hugging Face models - run on your machine/Colab GPU, zero cost,
  # no token needed (all are open-license, non-gated repos). Two or more
  # local models give Experiment 1 real peer answers. These three + the
  # judge (shares the Qwen-3B weights) all fit a 15 GB T4 at once - see
  # local.max_resident below - so they load once and never swap out.
  hf-smollm:
    provider: huggingface
    model: HuggingFaceTB/SmolLM2-1.7B-Instruct
    family: smollm
  hf-qwen:
    provider: huggingface
    model: Qwen/Qwen2.5-1.5B-Instruct
    family: qwen
  hf-qwen3b:
    provider: huggingface
    model: Qwen/Qwen2.5-3B-Instruct
    family: qwen
  # hf-phi is commented out so the remaining 3 models + judge fit in VRAM
  # permanently (zero reloads). Re-enable it if you move to a bigger GPU,
  # and set local.max_resident back to 2.
  # hf-phi:
  #   provider: huggingface
  #   model: microsoft/Phi-3.5-mini-instruct
  #   family: phi
  # Uncomment if you set HF_TOKEN and have been granted access (gated repo):
  # hf-llama:
  #   provider: huggingface
  #   model: meta-llama/Llama-3.2-3B-Instruct
  #   family: llama

# Graders (rubric YES/NO + the EGDA auditor). For each target model the
# first judge listed with a DIFFERENT family and a working token is used.
judges:
  # Local judge FIRST so grading also needs zero API keys. Its family is
  # kept distinct from every study model (including the Qwen ones), so the
  # independence rule - judge never shares the target's family - holds.
  # Reorder the list if you want an API judge to take priority.
  judge-hf-qwen:
    provider: huggingface
    model: Qwen/Qwen2.5-3B-Instruct
    family: hf-judge
  judge-deepseek:
    provider: openai
    model: deepseek-chat
    api_key_env: JUDGE_API_KEY
    base_url: https://api.deepseek.com
    family: deepseek
  judge-gpt:
    provider: openai
    model: gpt-5
    api_key_env: OPENAI_API_KEY
    family: openai
  judge-groq:
    provider: openai
    model: llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    family: groq
  judge-gemini:
    provider: google
    model: gemini-flash-latest
    api_key_env: GOOGLE_API_KEY
    family: google

local:
  # How many local Hugging Face models may stay in VRAM at once.
  # 4 = smollm + qwen + qwen3b + judge (the judge shares the Qwen-3B
  # weights, so real VRAM use is ~12.5 GB): everything loads ONCE and
  # the "Loading weights" bars never come back during the study.
  # If you re-enable hf-phi, set this back to 2 (study model + judge).
  max_resident: 4

generation:
  temperature: 0.0          # keep 0 for repeatable results
  max_tokens: 1024          # answer cap. Small local models ramble past this;
                            # a huge answer also slows down every judge call
                            # that has to read it (the "stuck at 77%" effect)

judging:
  temperature: 0.0
  max_tokens: 256           # rubric = one word, EGDA = short JSON; a rambling
                            # judge wastes minutes per criterion otherwise

experiment1:
  cells: [P1, P2, P3, P4, P5, P6]

experiment2:
  majority_sizes: [2, 3, 4]
  rounds: 3

judge_validation:
  human_sample_rate: 0.10   # fraction of gradings exported for human audit
